[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reveng"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "black>=25.9.0",
    "gymnasium==1.2.0",
    "imageio>=2.37.0",
    "isort>=6.0.1",
    "jinja2>=3.1.0",
    "litellm>=1.77.1",
    "matplotlib>=3.10.6",
    "minigrid==3.0.0",
    "pydantic>=2.0.0",
    "pytest>=8.4.2",
    "python-dotenv>=1.0.0",
    "tenacity>=9.1.2",
    "pandas>=2.3.3",
    "pyarrow>=18.0.0",
    "pip>=25.2",
    "peft>=0.17.1",
    "tqdm>=4.67.1",
    "scipy>=1.16.2",
    "ipykernel>=7.0.1",
    "jupyter>=1.1.1",
    "seaborn>=0.13.2",
    "together>=1.5.31",
    "tiktoken>=0.11.0",
    "torch>=2.6.0",
    "tyro>=0.10.0a6",
    "transformers==5.5.4",
    "huggingface_hub>=1.5.0,<2.0",
    "bitsandbytes>=0.48.1",
    "kernels==0.10.2",
    "scikit-learn>=1.7.0",
    "rbeast==0.1.25",
]

[tool.setuptools]
packages = { find = { where = ["src"] } }

[project.scripts]
"reveng-cli" = "reveng.commands.cli:main"
